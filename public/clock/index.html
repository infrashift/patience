        // Crisp paper-cut edge bevel & dark ink outline along the hinged chin seam
        defineJawCutoutPath(x, seamY);
        ctx.strokeStyle = 'rgba(245, 238, 220, 0.38)';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.beginPath();
        traceUpperLipCurve(x, seamY);
        ctx.strokeStyle = '#1a120e';
        ctx.lineWidth = 2.6;
        ctx.stroke();

        ctx.restore(); // End hinged jaw transform

        // Upper cut lip edge line following the cat's real curved whisker-pad lips
        ctx.beginPath();
        traceUpperLipCurve(x, seamY);
        ctx.strokeStyle = '#1a120e';
        ctx.lineWidth = 2.8;
        ctx.stroke();
      }

      ctx.restore();
    }

    /**
     * Renders intense ocular laser beams from the cat's pupils to the clock numbers,
     * leaving glowing scorch trails, plasma hotspots, and flying ember sparks.
     */
    function drawLaserBeamsAndSparks(leftEyePos, rightEyePos, hourAngle, minuteAngle, dt) {
      // If eyes are mostly closed during a blink, briefly interrupt the laser beam
      const beamPower = Math.max(0, 1 - state.blinkState * 1.35);

      // Compute exact pupil origin inside each eye
      const getPupilOrigin = (eyePos, gaze) => {
        const cosA = Math.cos(eyePos.angle || 0);
        const sinA = Math.sin(eyePos.angle || 0);
        const lx = gaze.x * 1.15;
        const ly = gaze.y * 0.95;
        return {
          x: eyePos.x + (lx * cosA - ly * sinA),
          y: eyePos.y + (lx * sinA + ly * cosA)
        };
      };

      const leftOrigin = getPupilOrigin(leftEyePos, state.leftEye);
      const rightOrigin = getPupilOrigin(rightEyePos, state.rightEye);

      // Target points right on the clock number ring (radius 316)
      const targetRadius = 318;
      const minTarget = {
        x: 400 + Math.cos(minuteAngle) * targetRadius,
        y: 400 + Math.sin(minuteAngle) * targetRadius
      };
      const hourTarget = {
        x: 400 + Math.cos(hourAngle) * targetRadius,
        y: 400 + Math.sin(hourAngle) * targetRadius
      };

      // Record glowing scorch trail marks along the number ring
      if (beamPower > 0.25) {
        state.scorchMarks.push(
          { x: minTarget.x + (Math.random() - 0.5) * 4, y: minTarget.y + (Math.random() - 0.5) * 4, life: 1.0, r: 5 + Math.random() * 4 },
          { x: hourTarget.x + (Math.random() - 0.5) * 4, y: hourTarget.y + (Math.random() - 0.5) * 4, life: 1.0, r: 7 + Math.random() * 5 }
        );
        if (state.scorchMarks.length > 90) {
          state.scorchMarks.splice(0, state.scorchMarks.length - 90);
        }

        // Spawn flying sparks & rising smoke particles at both laser impact points
        const spawnImpactParticles = (target, isHour) => {
          const count = isHour ? 3 : 2;
          for (let i = 0; i < count; i++) {
            const spreadAngle = Math.atan2(400 - target.y, 400 - target.x) + (Math.random() - 0.5) * 2.2;
            const speed = 35 + Math.random() * 110;
            state.sparks.push({
              x: target.x + (Math.random() - 0.5) * 6,
              y: target.y + (Math.random() - 0.5) * 6,
              vx: Math.cos(spreadAngle) * speed,
              vy: Math.sin(spreadAngle) * speed - 20,
              life: 0.4 + Math.random() * 0.45,
              maxLife: 0.85,
              size: 1.4 + Math.random() * 2.4,
              isSmoke: Math.random() < 0.28
            });
          }
        };
        spawnImpactParticles(minTarget, false);
        spawnImpactParticles(hourTarget, true);
      }

      ctx.save();

      // 1. Render smoldering scorch marks along the dial
      for (let i = state.scorchMarks.length - 1; i >= 0; i--) {
        const m = state.scorchMarks[i];
        m.life -= dt * 0.9;
        if (m.life <= 0) {
          state.scorchMarks.splice(i, 1);
          continue;
        }
        const grad = ctx.createRadialGradient(m.x, m.y, 0.5, m.x, m.y, m.r);
        grad.addColorStop(0, `rgba(255, 160, 40, ${m.life * 0.65})`);
        grad.addColorStop(0.5, `rgba(200, 30, 0, ${m.life * 0.45})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Helper to draw a multi-layered plasma laser beam
      const drawSingleLaser = (origin, target, widthScale, label) => {
        if (beamPower <= 0.05) return;
        const flicker = 0.88 + Math.random() * 0.24;
        const alpha = beamPower * flicker;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.lineCap = 'round';

        // Outer red thermal bloom
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(target.x, target.y);
        ctx.strokeStyle = `rgba(255, 25, 0, ${0.42 * alpha})`;
        ctx.lineWidth = 14 * widthScale * flicker;
        ctx.shadowColor = '#ff1100';
        ctx.shadowBlur = 24;
        ctx.stroke();

        // Mid orange-crimson plasma core
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(target.x, target.y);
        ctx.strokeStyle = `rgba(255, 110, 20, ${0.85 * alpha})`;
        ctx.lineWidth = 5.5 * widthScale * flicker;
        ctx.stroke();

        // Inner incandescent white-hot needle beam
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(target.x, target.y);
        ctx.strokeStyle = `rgba(255, 255, 240, ${0.98 * alpha})`;
        ctx.lineWidth = 2.0 * widthScale;
        ctx.stroke();

        // Ocular muzzle flashflare at the cat's slit pupil
        const eyeFlare = ctx.createRadialGradient(origin.x, origin.y, 1, origin.x, origin.y, 22 * widthScale);
        eyeFlare.addColorStop(0, `rgba(255, 255, 255, ${0.95 * alpha})`);
        eyeFlare.addColorStop(0.35, `rgba(255, 90, 10, ${0.8 * alpha})`);
        eyeFlare.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = eyeFlare;
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, 22 * widthScale, 0, Math.PI * 2);
        ctx.fill();

        // Molten impact fireball where the laser burns the clock number
        const impactR = (26 + Math.random() * 10) * widthScale;
        const impactFlare = ctx.createRadialGradient(target.x, target.y, 1, target.x, target.y, impactR);
        impactFlare.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        impactFlare.addColorStop(0.3, `rgba(255, 180, 40, ${0.95 * alpha})`);
        impactFlare.addColorStop(0.65, `rgba(255, 35, 0, ${0.65 * alpha})`);
        impactFlare.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = impactFlare;
        ctx.beginPath();
        ctx.arc(target.x, target.y, impactR, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      };

      // Left Eye = Minute Laser (focused beam), Right Eye = Hour Laser (heavy beam)
      drawSingleLaser(leftOrigin, minTarget, 0.88, 'MIN');
      drawSingleLaser(rightOrigin, hourTarget, 1.15, 'HR');

      // 3. Update & render flying ember sparks and smoke
      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const p = state.sparks[i];
        p.life -= dt;
        if (p.life <= 0) {
          state.sparks.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.isSmoke) {
          p.vy -= 18 * dt; // Smoke drifts upward
          p.vx *= 0.96;
        } else {
          p.vy += 120 * dt; // Sparks arc with gravity
        }

        const lifeRatio = Math.max(0, p.life / p.maxLife);
        ctx.save();
        if (p.isSmoke) {
          ctx.fillStyle = `rgba(40, 32, 30, ${lifeRatio * 0.35})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (2.4 - lifeRatio), 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.globalCompositeOperation = 'screen';
          ctx.strokeStyle = lifeRatio > 0.5 ? '#ffffff' : '#ff6600';
          ctx.shadowColor = '#ff2200';
          ctx.shadowBlur = 8;
          ctx.lineWidth = p.size * lifeRatio;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.restore();
    }

    // Start Animation Loop
    window.onload = function() {
      resizeCanvas();
      requestAnimationFrame(render);
    };
  </script>
</body>
